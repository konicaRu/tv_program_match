name: Telegram reminders

# Every 10 minutes from 09:00 to 23:59 Moscow time: the 09:00 digest and reminders
# about 40 minutes before each first showing. GitHub may start a scheduled run a few
# minutes late, which the 45-minute window absorbs. Sent messages are remembered in
# the Actions cache, so nothing is committed.
on:
  schedule:
    - cron: "*/10 6-20 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Только проверочное сообщение"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: telegram-reminders
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/cache/restore@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-

      - name: Send due messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '--test' || '' }}
        run: |
          mkdir -p .notify-state
          python -m collectors.notify $TEST

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}

  # Runs every 10 minutes, so only the first failure in a row is reported.
  alert:
    needs: notify
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send the failure explanation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > "$RUNNER_TEMP/jobs.json"
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow notify.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          python -m collectors.alert workflow --name "Напоминания" --jobs "$RUNNER_TEMP/jobs.json" --only-first \
            --previous "$previous" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
