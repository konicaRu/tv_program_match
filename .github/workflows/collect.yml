name: Collect schedule

on:
  schedule:
    # Twice a day, 07:15 and 19:15 Moscow time: Okko posts a stage's schedule mid-week.
    # Data is committed and the app redeployed only when something changed.
    - cron: "15 4 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-schedule
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus >/dev/null
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Remember the data before collecting
        run: mkdir -p "$RUNNER_TEMP/before" && cp -r public/data/. "$RUNNER_TEMP/before/"

      - name: Collect Match TV guide and Okko schedule
        id: collect
        run: |
          set +e
          python -m collectors.schedule --out public/data
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        id: commit
        run: |
          if [ -d public/data ]; then git add public/data; fi
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update schedule data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A source that just broke or works again, and World Cup races without an airing:
      # one Telegram message each, explained in plain Russian.
      - name: Telegram alerts about sources
        if: always() && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m collectors.alert sources --before "$RUNNER_TEMP/before"

      - name: Report source errors
        if: steps.collect.outputs.exit_code != '0'
        run: |
          cat public/data/status.json
          echo "::error::Часть источников недоступна, опубликованы прежние данные"
          exit 1

  # Publish the new data; runs even when a source failed, so the stale warning reaches the app.
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      actions: read  # deploy.yml's alert job asks for it, though it only runs on its own pushes
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # A failed step (tests, install, push, publishing) gets a Telegram message; source
  # failures are already explained by the step above.
  alert:
    needs: [collect, deploy]
    if: always() && (needs.collect.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send the failure explanation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > "$RUNNER_TEMP/jobs.json"
          python -m collectors.alert workflow --name "Сбор расписания" --jobs "$RUNNER_TEMP/jobs.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
