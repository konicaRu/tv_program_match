name: Collect schedule

on:
  schedule:
    # Every day at 07:15 Moscow time. The collector itself decides whether a run is due:
    # always on Sunday and Monday, on other days only while the week has gaps.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-schedule
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Collect Match TV guide
        id: collect
        env:
          # A manual run always collects; a scheduled one only when due.
          WHEN_DUE: ${{ github.event_name == 'schedule' && '--only-when-due' || '' }}
        run: |
          set +e
          python -m collectors.schedule --out public/data $WHEN_DUE
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        id: commit
        run: |
          if [ -d public/data ]; then git add public/data; fi
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update schedule data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report source errors
        if: steps.collect.outputs.exit_code != '0'
        run: |
          cat public/data/status.json
          echo "::error::Часть страниц «Матча» недоступна, опубликованы прежние данные"
          exit 1

  # Publish the new data; runs even when a source failed, so the stale warning reaches the app.
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
